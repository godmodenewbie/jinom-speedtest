version: "3.9"
services:
  directory:
    build:
      context: ./speedtest-directory
    image: jinom/speedtest-directory:local
    container_name: speedtest-directory
    ports:
      - "9088:8088"

  dps:
    build:
      context: ./speedtest-node
    image: jinom/speedtest-node:local
    container_name: speed-dps
    environment:
      - NODE_ID=node-dps
      - REGION=id-dps
      - ADDR=:8080
      - NODE_DOMAIN=node-speedtest.jinom.net
    ports:
      - "9080:80"
      - "9043:443"

  #jkt:
  #  build:
  #    context: ./speedtest-node
  #  image: jinom/speedtest-node:local
  #  container_name: speed-jkt
  #  environment:
  #    - NODE_ID=node-jkt
  #    - REGION=id-jkt
  #    - ADDR=:8081
  #    - NODE_DOMAIN=jkt.example.com
  #  ports:
  #    - "8081:80"
  #    - "8443:443"

  client:
    build:
      context: ./client
    image: jinom/speedtest-client:local
    container_name: speed-client
    ports:
      - "9082:80"
